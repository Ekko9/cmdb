apiVersion: v1
kind: Secret
metadata:
  name: cmdb-runtime
  labels:
    app.kubernetes.io/name: cmdb
type: Opaque
stringData:
  # Replace these values before applying this manifest.
  DB_URL: jdbc:mysql://mysql.example.com:3306/cmdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  DB_USERNAME: cmdb_app
  DB_PASSWORD: replace-with-database-password
  JWT_SECRET: replace-with-a-long-random-secret
  ADMIN_PASSWORD: replace-with-a-strong-initial-admin-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb
  labels:
    app.kubernetes.io/name: cmdb
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cmdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmdb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmdb
          image: orbit-cmdb:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: cmdb-runtime
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cmdb-runtime
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cmdb-runtime
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cmdb-runtime
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cmdb-runtime
                  key: ADMIN_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cmdb
  labels:
    app.kubernetes.io/name: cmdb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cmdb
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
