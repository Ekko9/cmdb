server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/cmdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:cmdb_app}"
    password: "${DB_PASSWORD:change-me}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
cmdb:
  jwt-secret: "${JWT_SECRET:change-me-before-startup}"
  jwt-expire-hours: ${JWT_EXPIRE_HOURS:12}
  initial-admin-password: "${ADMIN_PASSWORD:ChangeMe#Admin2026}"
logging:
  file:
    name: ${LOG_FILE:logs/cmdb.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:20MB}
      max-history: ${LOG_MAX_HISTORY:14}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:512MB}
